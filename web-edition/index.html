<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TimePlan Tools</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f4f5;color:#222;font-family:Arial,Helvetica,sans-serif}
.loader{max-width:900px;margin:110px auto;padding:0 24px}
.card{background:#fff;border:2px solid #0058A3;border-radius:10px;padding:28px 32px;box-shadow:0 4px 18px rgba(0,0,0,.12)}
h1{margin:0 0 8px;color:#0058A3;font-size:30px}
.version{font-weight:800;color:#555;margin-bottom:16px}
.loading-row{display:flex;align-items:center;gap:13px;min-height:26px}
.status{font-size:16px;color:#555;line-height:1.5}
.note{margin-top:12px;font-size:13px;color:#777;line-height:1.5}
.tp-spinner{width:23px;height:23px;flex:none;border:3px solid #D9E8F4;border-top-color:#0058A3;border-radius:50%;animation:tp-spin .85s linear infinite}
#tp-loader-indicator{display:inline-flex;align-items:center;justify-content:center;width:23px;height:23px;flex:none}
.tp-spinner.is-hidden{display:none}
.tp-dot{display:none;width:11px;height:11px;border-radius:50%;background:#16803C}
.tp-dot.is-visible{display:block}
#tp-loader-card[data-state="error"] .tp-dot{background:#B42318}
#tp-loader-card[data-state="ready"] .tp-dot{background:#16803C}
@keyframes tp-spin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.tp-spinner{animation:none;border-color:#0058A3 #D9E8F4 #D9E8F4 #D9E8F4}}
@media(max-width:600px){.loader{margin:65px auto;padding:0 16px}.card{padding:24px 20px}h1{font-size:27px}}
</style>
</head>
<body>
<div class="loader" id="tp-loader-card" data-state="loading"><div class="card"><h1>TimePlan Tools</h1><div class="version">Department Plan</div><div class="loading-row" role="status" aria-live="polite"><span id="tp-loader-indicator" aria-hidden="true"><span class="tp-spinner" id="tp-loader-spinner"></span><span class="tp-dot" id="tp-loader-dot"></span></span><span class="status" id="tp-loader-status">Loading TimePlan Tools…</span></div><div class="note">Open Department Plan in TimePlan, then select the TimePlan Tools favorite.</div></div></div>
<script>
/* Always request the latest published application code on each page load.
   The bookmarklet and saved roster snapshot remain unchanged. */
(function () {
  // One shared loader API for index.html and the application bridge.
  // States: loading (spinner), ready (green dot), error (red dot).
  window.TimePlanLoader = function (state, message) {
    const card = document.getElementById('tp-loader-card');
    if (!card) return;
    const next = ['loading', 'ready', 'error'].includes(state) ? state : 'error';
    card.dataset.state = next;
    const status = document.getElementById('tp-loader-status');
    if (status) {
      status.textContent = message;
      status.style.color = next === 'error' ? '#B42318' : '#555';
    }
    document.getElementById('tp-loader-spinner')?.classList.toggle('is-hidden', next !== 'loading');
    document.getElementById('tp-loader-dot')?.classList.toggle('is-visible', next !== 'loading');
  };
  function setLoaderStatus(message, isError = false, isWaiting = false) {
    window.TimePlanLoader(isError ? 'error' : isWaiting ? 'ready' : 'loading', message);
  }

  // When a generated Interactive Board is refreshed, restore the board
  // instead of displaying a blank tab or the normal roster loader.
  const boardId = new URLSearchParams(location.search).get('tp_board');
  if (boardId && /^tp-board-[a-zA-Z0-9-]+$/.test(boardId)) {
    const recoveryKey = 'timeplan-tools-board-recovery-' + boardId;
    const savedBoard = sessionStorage.getItem(recoveryKey);
    if (savedBoard && savedBoard.startsWith('<!DOCTYPE html>')) {
      document.open();
      document.write(savedBoard);
      document.close();
      window.__tpBoardRecoveryKey = recoveryKey;
      return;
    }
    window.TimePlanLoader('error', 'This Board snapshot is no longer available in this tab. Reopen it from TimePlan Tools.');
    return;
  }
  // Load the modules in order before the main application.
  function loadMainApplication() {
    setLoaderStatus('Starting TimePlan Tools…');
    const script = document.createElement('script');
    script.src = './timeplan-tools-app.js?v=' + Date.now();
    script.onload = () => {
      // The app removes this card itself when a roster arrives.
      // Otherwise, the page is ready and waiting for the bookmarklet.
      // App owns its status once initialized; avoid overwriting a real error.
      const card = document.getElementById('tp-loader-card');
      if (card && card.dataset.state === 'loading') {
        setLoaderStatus('Ready. Waiting for your roster.', false, true);
      }
    };
    script.onerror = () => setLoaderStatus('Could not load TimePlan Tools. Check your connection and try again.', true);
    document.body.appendChild(script);
  }

  // Batch E: app modules must load before the main application.
  const appModules = [
    './src/app/app-ui.js',
    './src/app/board-controller.js'
  ];
  function loadAppModules(index = 0) {
    if (index >= appModules.length) return loadMainApplication();
    setLoaderStatus('Loading application modules…');
    const module = document.createElement('script');
    module.src = appModules[index] + '?v=' + Date.now();
    module.onload = () => loadAppModules(index + 1);
    module.onerror = () => {
      console.error('Could not load App module:', appModules[index]);
      setLoaderStatus('Could not load TimePlan Tools App. Refresh and try again.', true);
    };
    document.body.appendChild(module);
  }

  function loadInteractiveBoardModule() {
    setLoaderStatus('Loading Interactive Board…');
    const module = document.createElement('script');
    module.src = './src/interactive-board/interactive-board.js?v=' + Date.now();
    module.onload = () => loadAppModules(0);
    module.onerror = function () {
      console.warn('Interactive Board module unavailable; existing board remains in the main app.');
      loadMainApplication();
    };
    document.body.appendChild(module);
  }

  function loadFullServeModule() {
    setLoaderStatus('Loading department configuration…');
    const module = document.createElement('script');
    module.src = './src/departments/full-serve.js?v=' + Date.now();
    module.onload = loadInteractiveBoardModule;
    // Full Serve configuration is required by the main application.
    module.onerror = function () {
      console.error('Full Serve configuration module unavailable.');
      setLoaderStatus('Could not load Full Serve configuration. Refresh and try again.', true);
    };
    document.body.appendChild(module);
  }

  // Batch D: load Core dependencies first, preserving the existing module order.
  const coreModules = [
    './src/core/time-utils.js',
    './src/core/function-utils.js',
    './src/core/roster-processing.js'
  ];
  function loadCoreModule(index) {
    if (index >= coreModules.length) return loadSortedModule();
    setLoaderStatus('Loading roster processing modules…');
    const module = document.createElement('script');
    module.src = coreModules[index] + '?v=' + Date.now();
    module.onload = () => loadCoreModule(index + 1);
    module.onerror = () => {
      console.error('Could not load Core module:', coreModules[index]);
      setLoaderStatus('Could not load TimePlan Tools Core. Refresh and try again.', true);
    };
    document.body.appendChild(module);
  }
  function loadSortedModule() {
  setLoaderStatus('Loading Sorted View…');
  const sortedModule = document.createElement('script');
  sortedModule.src = './src/sorted-view/sorted-view.js?v=' + Date.now();
  sortedModule.onload = loadFullServeModule;
  sortedModule.onerror = function () {
    console.warn('Sorted View module unavailable.');
    loadFullServeModule();
  };
  document.body.appendChild(sortedModule);
  }
  loadCoreModule(0);
})();
</script>
</body>
</html>
